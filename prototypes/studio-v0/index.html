<title>Open Game Maker 2000</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Press+Start+2P&family=Bungee&family=Creepster&family=Lilita+One&family=Russo+One&display=swap" rel="stylesheet">
<style>
/* Layout: a paper desk (blueprint grid + paint splatters) that every app screen sits on; games keep their own looks.
   Native UI uses gruvbox (light paper for screens, dark for the voice and video panels). Single look by choice. */
:root {
  color-scheme: light;
  --paper: #fbf1c7; --paper-2: #f2e5bc; --paper-3: #ebdbb2; --ink: #3c3836; --ink-2: #504945; --muted: #7c6f64; --rule: #d5c4a1;
  --night: #282828; --night-2: #32302f; --night-3: #3c3836; --cream: #ebdbb2;
  --red: #cc241d; --red-b: #fb4934; --green: #98971a; --green-b: #b8bb26; --yellow: #d79921; --yellow-b: #fabd2f;
  --blue: #458588; --blue-b: #83a598; --purple: #b16286; --purple-b: #d3869b; --aqua: #689d6a; --aqua-b: #8ec07c; --orange: #d65d0e; --orange-b: #fe8019;
  --display: 'Fredoka', 'Nunito', system-ui, sans-serif; --body: 'Nunito', system-ui, sans-serif;
  --pop: 0 4px 0 var(--ink); --pop-sm: 0 3px 0 var(--ink); --r: 18px;
  --check: repeating-conic-gradient(var(--ink) 0 25%, var(--paper) 0 50%) 0 0 / 10px 10px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; font-family: var(--body); color: var(--ink); background-color: var(--paper);
  background-image: linear-gradient(rgba(69,133,136,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(69,133,136,.13) 1px, transparent 1px),
    linear-gradient(rgba(69,133,136,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(69,133,136,.07) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
body.modal-open { overflow: hidden; }
#splat { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: .8; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }

/* buttons: stickers with an ink outline and a drop under them */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 17px;
  padding: 10px 20px; border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: var(--pop-sm); transition: transform .12s, box-shadow .12s; }
.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 5px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; }
.btn.green { background: var(--green-b); } .btn.yellow { background: var(--yellow-b); } .btn.coral { background: var(--red-b); color: var(--paper); }
.btn.ghost { background: transparent; box-shadow: none; border-style: dashed; }
.btn.small { font-size: 15px; padding: 6px 14px; }
.btn .ic { width: 22px; height: 22px; display: inline-flex; } .btn .ic svg { width: 100%; height: 100%; }
.back { display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 18px; padding: 8px 18px 8px 14px;
  border: 3px solid var(--ink); border-radius: 999px; background: var(--paper); box-shadow: var(--pop-sm); }
.back::before { content: ''; width: 0; height: 0; border: 7px solid transparent; border-right: 10px solid var(--ink); border-left: 0; }
.chip { display: inline-block; font: 700 13px var(--body); padding: 2px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper); margin: 2px 4px 2px 0; }

/* screens */
.screen { position: relative; z-index: 1; min-height: 100%; }
.page { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 140px; }
.bar-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-block: 6px 16px; position: relative; }
.bar-top h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; letter-spacing: .5px; text-align: center; }
.bar-top::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--check); border-radius: 3px; opacity: .85;
  -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.bar-top .right { justify-self: end; }

/* title: the dungeon prototype's own home screen */
#s-title { position: fixed; inset: 0; z-index: 5; background: var(--paper); }
#titleFrame { width: 100%; height: 100%; border: 0; display: block; }

/* library */
.lib-sub { text-align: center; color: var(--muted); font-weight: 700; margin: 14px 0 22px; }
#lib-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.tile { text-align: left; padding: 0; border: 3px solid var(--ink); border-radius: var(--r); background: var(--paper); box-shadow: var(--pop); overflow: hidden;
  transition: transform .18s cubic-bezier(.2,.9,.3,1.3), box-shadow .18s; }
.tile:nth-child(3n+1) { rotate: -.6deg; } .tile:nth-child(3n+2) { rotate: .4deg; } .tile:nth-child(3n) { rotate: -.2deg; }
.tile:hover, .tile:focus-visible { transform: translateY(-5px) rotate(.4deg); box-shadow: 0 9px 0 var(--ink); }
.cover { position: relative; aspect-ratio: 16 / 9; background: var(--night); overflow: hidden; border-bottom: 3px solid var(--ink); }
.cover canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.cover-title { position: absolute; left: 12px; right: 12px; bottom: 10px; font-size: clamp(14px, 1.8vw, 21px); line-height: 1.2; text-shadow: 0 2px 0 #1d2021, 2px 0 0 #1d2021, -2px 0 0 #1d2021, 0 -2px 0 #1d2021, 0 4px 6px rgba(0,0,0,.5); }
.badge { position: absolute; top: 10px; left: 10px; font: 700 12px var(--display); letter-spacing: .4px; text-transform: uppercase; padding: 3px 10px; border: 2px solid var(--ink); border-radius: 999px; background: var(--yellow-b); }
.tile-meta { display: flex; align-items: center; gap: 8px; padding: 10px 12px 12px; }
.genres { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; min-width: 0; }
.genres i { font: 700 12px var(--body); font-style: normal; padding: 1px 9px; border-radius: 999px; background: var(--paper-3); border: 2px dashed var(--rule); }
.stars { font: 700 14px var(--display); color: var(--orange); white-space: nowrap; }
.tile.building .cover-title { color: var(--paper) !important; }
.build-chip { position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 6px; font: 700 13px var(--display); padding: 4px 10px 4px 6px; border-radius: 999px; background: var(--paper); border: 2px solid var(--ink); }
.ring { --p: 0; width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 360deg), var(--rule) 0); display: inline-block; }
.tile.fresh { animation: fresh 1.2s 2 ease-in-out; }
@keyframes fresh { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 8px rgba(250,189,47,.7); } }
#new-game { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); translate: -50% 0; z-index: 20; border: 0; background: none; padding: 0; filter: drop-shadow(0 4px 0 var(--ink)); transition: transform .15s; }
#new-game:hover { transform: translateY(-3px) rotate(-1deg); }
#new-game svg { width: min(340px, 78vw); height: auto; display: block; }
#new-game .lbl { position: absolute; inset: 0; display: grid; place-items: center; font: 700 clamp(26px, 5vw, 36px) var(--display); padding-top: 4px; }

/* game modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(29,32,33,.62); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.sheet-card { position: relative; width: min(1120px, 100%); background: var(--paper); border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 8px 0 var(--ink); display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); overflow: hidden; animation: rise .28s cubic-bezier(.2,.9,.3,1.2); }
@keyframes rise { from { transform: translateY(24px) scale(.97); opacity: 0; } }
.x { position: absolute; top: 12px; right: 12px; z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); font: 700 18px var(--display); box-shadow: var(--pop-sm); }
.gm-media { background: var(--night); padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
.video { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; border: 3px solid #1d2021; background: #1d2021; }
.video canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
#gm-flash { position: absolute; inset: 0; background: #fbf1c7; opacity: 0; pointer-events: none; }
.video .live { position: absolute; top: 10px; left: 10px; display: inline-flex; align-items: center; gap: 6px; font: 700 12px var(--display); letter-spacing: .6px; text-transform: uppercase; color: var(--cream); background: rgba(29,32,33,.75); padding: 4px 10px; border-radius: 999px; }
.video .live::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--red-b); animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .2; } }
#gm-scene { position: absolute; top: 10px; right: 10px; font: 700 12px var(--display); color: var(--cream); background: rgba(29,32,33,.75); padding: 4px 10px; border-radius: 999px; }
.scrub { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(235,219,178,.2); } #gm-progress { height: 100%; background: var(--yellow-b); }
#gm-thumbs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.thumb { flex: 0 0 auto; width: 132px; padding: 0; border: 3px solid transparent; border-radius: 10px; background: #1d2021; overflow: hidden; color: var(--cream); text-align: left; }
.thumb canvas { width: 100%; aspect-ratio: 16/9; display: block; image-rendering: pixelated; }
.thumb span { display: block; font: 700 12px var(--body); padding: 4px 8px 6px; }
.thumb.on { border-color: var(--yellow-b); }
.gm-info { padding: 26px 26px 22px; display: flex; flex-direction: column; gap: 12px; min-width: 0; max-height: min(86vh, 760px); overflow-y: auto; }
#gm-title { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.25; padding-right: 44px; }
#gm-by { color: var(--blue); font-weight: 800; font-size: 14px; }
#gm-tag { font: 600 17px var(--display); margin: 0; }
#gm-desc { margin: 0; color: var(--ink-2); line-height: 1.5; }
#gm-facts { margin: 0; display: grid; gap: 7px; padding: 12px 0; border-block: 3px dashed var(--rule); }
.kv { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.kv dt { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; font-size: 14px; }
.stars-big { color: var(--orange); letter-spacing: 1px; }
.gm-actions { display: flex; gap: 12px; flex-wrap: wrap; }
.gm-actions .btn { flex: 1 1 140px; font-size: 20px; padding: 12px 18px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
#gm-building { background: var(--paper-2); border: 2px dashed var(--rule); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 14px; }

/* play / edit */
#s-play { position: fixed; inset: 0; z-index: 4; display: flex; flex-direction: column; background: var(--paper); }
.play-bar { display: flex; align-items: center; gap: 10px; padding: max(8px, env(safe-area-inset-top, 0px)) max(76px, calc(env(safe-area-inset-right, 0px) + 76px)) 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 3px solid var(--ink); background: var(--paper-2); flex-wrap: wrap; }
.play-bar .back { font-size: 16px; padding: 6px 14px 6px 10px; }
#pb-title { font: 700 20px var(--display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg { display: inline-flex; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; box-shadow: var(--pop-sm); background: var(--paper); }
.seg button { border: 0; background: none; padding: 6px 16px; font: 700 15px var(--display); }
.seg button[aria-pressed="true"] { background: var(--green-b); }
.seg button + button { border-left: 3px solid var(--ink); }
.seg button[data-mode="edit"][aria-pressed="true"] { background: var(--yellow-b); }
#gameFrame { flex: 1; width: 100%; border: 0; display: block; }

/* wizard */
.wz-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-block: 6px 6px; }
#wz-title { font-size: clamp(30px, 5vw, 46px); text-align: center; }
#wz-dots { justify-self: end; display: flex; gap: 8px; }
#wz-dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); }
#wz-dots i.done { background: var(--ink); } #wz-dots i.now { background: var(--yellow-b); transform: scale(1.15); }
.wz-ask { text-align: center; margin: 12px 0 4px; font: 600 clamp(19px, 2.6vw, 24px) var(--display); }
.wz-hint { text-align: center; color: var(--muted); font-weight: 700; margin: 0 0 22px; }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
.opt { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 150px; padding: 14px 10px;
  border: 3px dashed var(--rule); border-radius: var(--r); background: rgba(251,241,199,.82); transition: transform .15s, border-color .15s, background .15s, opacity .15s; }
.opt .ic { width: 64px; height: 64px; display: block; transition: transform .2s cubic-bezier(.2,.9,.3,1.6); } .opt .ic svg { width: 100%; height: 100%; display: block; overflow: visible; }
.opt .lb { font: 600 18px var(--display); }
.opt:hover .ic { transform: rotate(-6deg) scale(1.08); }
.opt[aria-pressed="true"] { border: 3px solid var(--ink); background: var(--paper); box-shadow: var(--pop); }
.opt[aria-pressed="true"]::after { content: '✓'; position: absolute; top: -10px; right: -10px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: var(--green-b); border: 3px solid var(--ink); font: 700 16px var(--display); }
.opt.pop .ic { animation: boing .5s cubic-bezier(.2,.9,.3,1.6); }
@keyframes boing { 30% { transform: scale(1.3) rotate(8deg); } 60% { transform: scale(.92) rotate(-4deg); } }
.opt.nope { animation: nope .35s; } @keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.opt-grid.full .opt:not([aria-pressed="true"]):not(.typing) { opacity: .5; }
.opt.other { padding: 0; overflow: hidden; }
.other-face { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 150px; }
.other-pick { display: grid; grid-template-columns: 1fr 1fr; width: 100%; min-height: 150px; }
.other-pick button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font: 600 16px var(--display); animation: flipin .3s ease-out; }
.other-pick button + button { border-left: 3px dashed var(--rule); }
.other-pick button:hover { background: var(--paper-3); }
.other-pick svg { width: 48px; height: 48px; }
@keyframes flipin { from { transform: rotateY(90deg); } }
.other.filled { padding: 14px; border: 3px solid var(--ink); background: var(--paper); box-shadow: var(--pop); }
.other-text { font: 600 15px var(--display); text-align: center; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.other-acts { display: flex; gap: 6px; }
.mini { width: 34px; height: 34px; padding: 5px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper-2); font-weight: 800; }
.mini svg { width: 100%; height: 100%; }
.other.typing { padding: 10px; border-style: solid; border-color: var(--ink); background: var(--paper); }
.other-form { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.other-form textarea { width: 100%; resize: none; font: 600 15px var(--body); padding: 8px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper-2); color: var(--ink); }
.wz-foot { display: flex; justify-content: center; margin-top: 28px; }
.wz-foot .btn { font-size: 20px; padding: 12px 40px; }

/* art preview popover */
#art-pop { position: absolute; z-index: 40; background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); padding: 14px; animation: rise .22s; }
#art-pop.sheet { position: fixed; left: 12px !important; right: 12px; bottom: 12px; top: auto !important; width: auto !important; }
.pop-head { display: flex; gap: 12px; align-items: flex-start; padding-right: 40px; }
.pop-head .ic { width: 44px; height: 44px; flex: 0 0 44px; } .pop-head svg { width: 100%; height: 100%; }
.pop-head h3 { font-size: 20px; } .pop-head p { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
#art-pop .x { top: 10px; right: 10px; width: 34px; height: 34px; font-size: 15px; }
.pop-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
.pop-strip figure { margin: 0; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: var(--night); }
.pop-strip img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; display: block; }
.pop-strip figcaption { font: 700 12px var(--body); padding: 5px 8px; background: var(--paper-2); }
.pop-foot { margin: 10px 0 0; font-size: 13px; color: var(--muted); }

/* talk step + voice panels */
.pick-sum { max-width: 900px; margin: 0 auto 16px; display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 3px dashed var(--rule); border-radius: 14px; background: rgba(251,241,199,.85); }
.sum-row { font-size: 14px; } .sum-k { font: 700 12px var(--body); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-right: 6px; } .muted { color: var(--muted); }
.talk-host { max-width: 900px; margin: 0 auto; }
.vs { display: grid; gap: 14px; background: var(--night); color: var(--cream); border: 3px solid var(--ink); border-radius: 20px; padding: 16px; box-shadow: var(--pop); }
.vs.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.vs-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.vs-side header { display: flex; justify-content: space-between; align-items: baseline; }
.vs-side .who { font: 700 18px var(--display); } .vs-side .state { font: 700 13px var(--body); color: var(--yellow-b); }
.agent .who { color: var(--orange-b); }
.seis, .orb { width: 100%; height: 150px; border-radius: 12px; border: 2px solid #1d2021; display: block; }
.caption { height: 168px; overflow-y: auto; background: var(--night-2); border-radius: 12px; padding: 10px 14px; font: 700 17px/1.45 var(--body); }
.caption .line { margin: 0 0 8px; } .caption .line.old { color: #a89984; font-size: 15px; }
.caption .line.typed::before { content: '✎ '; color: var(--yellow-b); }
.vs.one .caption { height: auto; min-height: 96px; font-size: 20px; }
.vs-type { grid-column: 1 / -1; display: flex; gap: 10px; }
.vs-type textarea { flex: 1; resize: none; font: 700 16px var(--body); padding: 10px 12px; border-radius: 12px; border: 2px solid var(--cream); background: var(--night-2); color: var(--cream); }
.vs-controls { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.vs-controls .grow { flex: 1; }
.vs .btn { box-shadow: 0 3px 0 #1d2021; border-color: #1d2021; }
.vs .btn.ghost { color: var(--cream); border-color: var(--cream); }
.vs .btn.ghost .ic svg { stroke: var(--ink); }
.mic[aria-pressed="true"] { background: var(--red-b); color: var(--paper); }
.finish.glow { animation: glow 1.6s infinite; } @keyframes glow { 50% { box-shadow: 0 3px 0 #1d2021, 0 0 0 7px rgba(184,187,38,.45); } }
#voice-modal .sheet-card { display: block; width: min(860px, 100%); background: var(--paper); padding: 18px; }
#voice-modal h2 { font-size: 24px; margin: 4px 50px 14px 4px; }

/* loading: three dots */
#loading { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(251,241,199,.92); }
.dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }
.dots i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--ink); animation: bounce 1s infinite ease-in-out; }
.dots i:nth-child(1) { background: var(--red-b); } .dots i:nth-child(2) { background: var(--yellow-b); animation-delay: .15s; } .dots i:nth-child(3) { background: var(--blue-b); animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-22px); } }
#ld-text { font: 600 22px var(--display); text-align: center; }

/* progress tracker: collapsed button → one combined bar → every build */
#tracker { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); z-index: 45; display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 10px; }
#tracker.hidden { display: none; }
#tracker.inbar { top: max(6px, env(safe-area-inset-top, 0px)); bottom: auto; flex-direction: column; }
#tracker.inbar #tr-fab { width: 50px; height: 50px; }
#tr-fab { position: relative; width: 62px; height: 62px; border-radius: 50%; border: 3px solid var(--ink); background: var(--paper); box-shadow: var(--pop-sm); padding: 0; display: grid; place-items: center; }
#tr-fab svg.ringsvg { position: absolute; inset: 3px; width: calc(100% - 6px); height: calc(100% - 6px); rotate: -90deg; }
#tr-ring { transition: stroke-dashoffset .3s; }
#tr-fab .hammer { width: 26px; height: 26px; animation: tap 1.1s infinite ease-in-out; transform-origin: 70% 70%; }
#tr-fab.idle .hammer { animation: none; }
@keyframes tap { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-28deg); } 55% { transform: rotate(8deg); } }
#tr-count { position: absolute; top: -8px; right: -8px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--purple-b); border: 2px solid var(--ink); font: 700 13px/20px var(--display); }
#tracker.ping #tr-fab { animation: ping .6s; } @keyframes ping { 40% { transform: scale(1.18); } }
.tr-panel { width: min(380px, calc(100vw - 32px)); background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: var(--pop); padding: 12px; animation: rise .2s; }
#tracker[data-state="collapsed"] .tr-panel { display: none; }
.tr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.tr-head h3 { font-size: 17px; }
#tr-speed { display: inline-flex; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
#tr-speed button { border: 0; background: none; font: 700 12px var(--display); padding: 2px 8px; }
#tr-speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
#tr-sum { width: 100%; text-align: left; border: 2px solid var(--ink); border-radius: 12px; background: var(--paper-2); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
#tr-sum-label { font: 700 15px var(--display); }
#tr-sum-pct { font: 700 15px var(--display); font-variant-numeric: tabular-nums; }
#tr-sum .bar { grid-column: 1 / -1; }
#tr-sum .chev { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 800; }
.bar { height: 12px; border-radius: 999px; border: 2px solid var(--ink); background: var(--paper); overflow: hidden; }
.bar i { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--green-b) 0 8px, var(--aqua-b) 8px 16px); background-size: 22px 22px; animation: stripe 1s linear infinite; transition: width .3s; }
#tr-sum-bar { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--yellow-b) 0 8px, var(--orange-b) 8px 16px); background-size: 22px 22px; animation: stripe 1s linear infinite; transition: width .3s; }
@keyframes stripe { to { background-position: 22px 0; } }
#tr-list { list-style: none; margin: 10px 0 0; padding: 0; display: none; flex-direction: column; gap: 10px; max-height: 46vh; overflow-y: auto; }
#tracker[data-state="expanded"] #tr-list { display: flex; }
#tr-list li { border-top: 2px dashed var(--rule); padding-top: 8px; }
.tr-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
.tr-row b { flex: 1; min-width: 0; font: 600 14px var(--display); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tr-row .tl { font: 700 13px var(--display); font-variant-numeric: tabular-nums; color: var(--muted); }
.kind { font: 700 11px var(--body); text-transform: uppercase; letter-spacing: .5px; padding: 1px 7px; border-radius: 999px; border: 2px solid var(--ink); }
.kind.game { background: var(--blue-b); } .kind.feature { background: var(--purple-b); }
#tr-list small { color: var(--muted); font-weight: 700; }
#tr-list li.done .bar i { background: var(--green-b); animation: none; }

#toast { visibility: hidden; position: fixed; left: 50%; top: max(16px, env(safe-area-inset-top, 0px)); translate: -50% -140%; z-index: 80; background: var(--ink); color: var(--paper); font: 600 16px var(--display); padding: 10px 20px; border-radius: 999px; transition: translate .3s cubic-bezier(.2,.9,.3,1.3); max-width: calc(100vw - 32px); text-align: center; }
#toast.show { translate: -50% 0; visibility: visible; } #toast.good { background: var(--green); }

@media (max-width: 960px) {
