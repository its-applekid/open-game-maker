<!doctype html>
<meta charset="utf-8">
<title>Creature Lineup</title>
<!-- Candidate characters from our packs side by side, labelled with their pack and built-in animations (models/candidates/*).
     window.__ready is set once drawn (for screenshots). -->
<style>html,body{margin:0;background:#f2e5bc;font:13px system-ui}canvas{display:block}.lab{position:absolute;transform:translate(-50%,0);text-align:center;color:#3c3836;width:150px}.lab b{display:block;font-size:14px}.lab i{color:#7c6f64;font-style:normal;font-size:11px}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const list = (await (await fetch('creatures.json')).json());
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(innerWidth, innerHeight); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#f2e5bc');
scene.add(new THREE.HemisphereLight('#fff', '#998', 1.7)); const sun = new THREE.DirectionalLight('#fff', 1.4); sun.position.set(3, 6, 5); scene.add(sun);
const cols = 8, loader = new GLTFLoader(), rows = Math.ceil(list.length / cols), W = cols * 2.6, Hh = rows * 3.1, asp = innerWidth / innerHeight, half = Math.max(W / asp, Hh) / 2 + .4;
const cam = new THREE.OrthographicCamera(-half * asp, half * asp, half, -half, .1, 100); cam.position.set(W / 2 - 1.3, -Hh / 2 + 1.9, 30); cam.lookAt(W / 2 - 1.3, -Hh / 2 + 1.6, 0);
for (const [i, c] of list.entries()) {
  const g = await loader.loadAsync(`../models/candidates/${c.path}.glb`), o = g.scene, b = new THREE.Box3().setFromObject(o), s = 1.6 / Math.max(b.max.y - b.min.y, b.max.x - b.min.x);
  o.scale.setScalar(s); o.position.set((i % cols) * 2.6, -b.min.y * s - Math.floor(i / cols) * 3.1, 0); o.rotation.y = .5; scene.add(o);
  if (g.animations.length) { const mx = new THREE.AnimationMixer(o), a = g.animations.find(a => /walk|idle/.test(a.name)) || g.animations[0]; mx.clipAction(a).play(); mx.update(.3); }
  cam.updateMatrixWorld(); const p = new THREE.Vector3(o.position.x, o.position.y + b.min.y * s - .1, 0).project(cam);
  const d = document.createElement('div'); d.className = 'lab'; d.style.left = (p.x + 1) / 2 * innerWidth + 'px'; d.style.top = (1 - p.y) / 2 * innerHeight + 'px';
  d.innerHTML = `<b>${c.name}</b><i>${c.pack} · ${g.animations.length ? g.animations.length + ' animations' : 'no animations'}</i>`; document.body.appendChild(d);
}
renderer.render(scene, cam); window.__ready = true;
</script>
