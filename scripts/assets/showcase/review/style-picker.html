<!doctype html>
<!--
  Style picker review page: the reference layout Kevin approved on 2026-11-03 (phone: diorama on top, sprite sheet
  under it, scene thumbnails at the bottom, filling the screen with no overlap at any height; style arrows in the side
  margins; no labels on screen, names in aria-label only). The app's style step (apps/web/src/routes/new/StyleStep.tsx)
  should match it.
  Media is licensed and never committed: serve the repo root on the host and open
  /scripts/assets/showcase/review/style-picker.html?root=<media dir relative to this page>; the default reads the v5
  media from the shared library (assets-local is a symlink in aiur workspaces).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SmallScaleInt style picker review</title>
    <style>
      :root {
        color-scheme: dark;
        --paper: #11131b;
        --paper-2: #1b1e29;
        --ink: #f4f1de;
        --muted: #aba9b5;
        --rule: #454958;
        --accent: #79d2a6;
        --accent-soft: #213f36;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      }

      button {
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      .picker {
        display: grid;
        grid-template-rows: auto auto auto;
        align-content: start;
        gap: 10px;
        width: min(100%, 960px);
        height: 100svh;
        margin: 0 auto;
        padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
        overflow: hidden;
      }

      .set-nav {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 48px;
        align-items: center;
        gap: 8px;
        min-height: 48px;
      }

      .set-nav h1 {
        min-width: 0;
        margin: 0;
        overflow: hidden;
        font-size: clamp(19px, 5vw, 28px);
        text-align: center;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .style-button {
        display: grid;
        place-items: center;
        width: 48px;
        height: 42px;
        padding: 0;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--ink);
        font-size: 36px;
        line-height: 1;
      }

      .previews {
        --media-size: min(calc((100vw - 34px) / 2), calc(100svh - 190px), 360px);

        display: grid;
        grid-template-columns: repeat(2, var(--media-size));
        place-content: center;
        gap: 10px;
        min-height: 0;
      }

      .track {
        position: relative;
        width: var(--media-size);
        aspect-ratio: 1;
        margin: 0;
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 18px;
        background: var(--paper-2);
      }

      .track video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .track figcaption {
        position: absolute;
        right: 6px;
        bottom: 6px;
        padding: 3px 7px;
        border-radius: 999px;
        background: rgb(17 19 27 / 78%);
        color: var(--ink);
        font-size: 11px;
        font-weight: 750;
      }

      .scene-row {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 48px;
        align-items: stretch;
        gap: 8px;
        min-height: 82px;
      }

      .scene-button {
        min-width: 48px;
        padding: 0;
        border: 1px solid color-mix(in srgb, var(--accent) 65%, var(--rule));
        border-radius: 14px;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 23px;
        font-weight: 800;
      }

      .stops {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 72px;
        justify-content: safe center;
        gap: 7px;
        min-width: 0;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        padding: 1px;
        scrollbar-width: thin;
      }

      .stop {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-width: 0;
        padding: 4px;
        overflow: hidden;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--paper-2);
      }

      .stop[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .stop img {
        width: 100%;
        min-height: 0;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        border-radius: 7px;
      }

      .stop span {
        overflow: hidden;
        padding-top: 3px;
        color: var(--muted);
        font-size: 9px;
        line-height: 1.15;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .stop[aria-pressed="true"] span {
        color: var(--ink);
      }

      @media (max-aspect-ratio: 1/1) {
        .picker {
          position: relative;
          grid-template-rows: minmax(0, 1fr) auto;
          align-content: stretch;
        }

        .set-nav {
          display: contents;
        }

        .set-nav h1 {
          display: none;
        }

        .style-button {
          position: absolute;
          z-index: 1;
          top: calc(6px + (100svh - 94px) / 2 - min(100vw - 88px, (100svh - 102px) / 2) / 2);
          width: 40px;
          transform: translateY(-50%);
        }

        [data-previous-style] {
          left: 2px;
        }

        [data-next-style] {
          right: 2px;
        }

        .previews {
          container-type: size;
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto;
          align-content: center;
          justify-items: center;
          gap: 8px;
        }

        .track {
          width: min(100cqw - 88px, (100cqh - 8px) / 2);
        }

        .scene-row {
          min-height: 64px;
        }

        .stop {
          display: block;
          padding: 3px;
        }

        .stop img {
          height: 100%;
          aspect-ratio: auto;
        }
      }

      @media (max-height: 500px) {
        .picker {
          gap: 6px;
          padding-block: 6px;
        }

        .set-nav {
          min-height: 40px;
        }

        .style-button {
          height: 38px;
        }

        .previews {
          --media-size: min(calc((100vw - 34px) / 2), calc(100svh - 154px), 360px);
        }

        .scene-row {
          min-height: 70px;
        }

        .stop span,
        .track figcaption {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        video {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <main class="picker" data-review-picker>
      <header class="set-nav">
        <button class="style-button" type="button" aria-label="Previous style" data-previous-style>‹</button>
        <h1 data-title style="visibility: hidden"></h1>
        <button class="style-button" type="button" aria-label="Next style" data-next-style>›</button>
      </header>

      <section class="previews" aria-label="Style previews">
        <figure class="track" data-region-track>
          <video muted loop autoplay playsinline aria-label="Diorama preview"></video>
        </figure>
        <figure class="track" data-sheet-track>
          <video muted loop autoplay playsinline aria-label="Sprite sheets preview"></video>
        </figure>
      </section>

      <nav class="scene-row" aria-label="Showcase scenes">
        <button class="scene-button" type="button" aria-label="Previous scene" data-previous-scene>|‹</button>
        <div class="stops" role="group" aria-label="Showcase regions" data-stops></div>
        <button class="scene-button" type="button" aria-label="Next scene" data-next-scene>›|</button>
      </nav>
    </main>

    <script type="module">
      const styles = [
        { label: 'SmallScaleInt', root: new URLSearchParams(location.search).get('root') ?? '../../../../assets-local/sets/smallscaleint/showcase/out/media-v5' },
      ];
      const state = { style: 0, scene: 0, outline: false, manifest: undefined };
      const region = document.querySelector('[data-region-track] video');
      const sheet = document.querySelector('[data-sheet-track] video');
      const stops = document.querySelector('[data-stops]');
      const title = document.querySelector('[data-title]');

      function sceneLabel(stop) {
        return stop.label ?? stop.story?.title ?? stop.story?.summary ?? stop.id.replace(/^\d+-/, '').replaceAll('-', ' ');
      }

      function play(video) {
        video.play().catch(() => {});
      }

      function selectScene(index, ensureVisible = true) {
        const style = styles[state.style];
        const scenes = state.manifest.stops;
        state.scene = (index + scenes.length) % scenes.length;
        const stop = scenes[state.scene];
        state.outline = false;
        region.src = `${style.root}/${stop.region.mp4}`;
        region.poster = `${style.root}/${stop.region.poster}`;
        sheet.src = `${style.root}/${stop.sheet.mp4}`;
        sheet.poster = `${style.root}/${stop.sheet.poster}`;
        for (const [buttonIndex, button] of [...stops.children].entries())
          button.setAttribute('aria-pressed', String(buttonIndex === state.scene));
        if (ensureVisible) {
          const selected = stops.children[state.scene];
          if (selected)
            stops.scrollTo({
              left: selected.offsetLeft - (stops.clientWidth - selected.clientWidth) / 2,
              behavior: 'smooth',
            });
        }
        play(region);
        play(sheet);
      }

      function renderScenes() {
        const style = styles[state.style];
        const buttons = state.manifest.stops.map((stop, index) => {
            const button = document.createElement('button');
            button.className = 'stop';
            button.type = 'button';
            button.dataset.scene = stop.id;
            button.setAttribute('aria-pressed', String(index === state.scene));
            button.setAttribute('aria-label', sceneLabel(stop));
            button.innerHTML = `<img src="${style.root}/${stop.region.poster}" alt="">`;
            button.addEventListener('click', () => selectScene(index));
            return button;
          });
        if (state.manifest.outlineOptions) {
          const outline = document.createElement('button');
          outline.className = 'stop';
          outline.type = 'button';
          outline.dataset.outlineOptions = '';
          outline.setAttribute('aria-label', 'Outline options sheet');
          outline.setAttribute('aria-pressed', 'false');
          outline.innerHTML = `<img src="${style.root}/${state.manifest.outlineOptions.sheet.poster}" alt="">`;
          outline.addEventListener('click', selectOutline);
          buttons.push(outline);
        }
        stops.replaceChildren(...buttons);
      }

      function selectOutline() {
        const outline = state.manifest.outlineOptions;
        if (!outline) return;
        selectScene(state.manifest.stops.length - 1, false);
        state.outline = true;
        const style = styles[state.style];
        sheet.src = `${style.root}/${outline.sheet.mp4}`;
        sheet.poster = `${style.root}/${outline.sheet.poster}`;
        for (const button of stops.children)
          button.setAttribute('aria-pressed', String(button.hasAttribute('data-outline-options')));
        const selected = stops.querySelector('[data-outline-options]');
        stops.scrollTo({
          left: selected.offsetLeft - (stops.clientWidth - selected.clientWidth) / 2,
          behavior: 'smooth',
        });
        play(sheet);
      }

      async function selectStyle(index) {
        state.style = (index + styles.length) % styles.length;
        state.scene = 0;
        state.outline = false;
        const style = styles[state.style];
        state.manifest = await fetch(`${style.root}/manifest.json`).then((response) => {
          if (!response.ok) throw new Error(`Could not load ${style.label} manifest`);
          return response.json();
        });
        title.textContent = style.label;
        renderScenes();
        stops.scrollLeft = 0;
        selectScene(0, false);
      }

      region.addEventListener('timeupdate', () => {
        if (Math.abs(region.currentTime - sheet.currentTime) > 0.12) sheet.currentTime = region.currentTime;
      });
      document.querySelector('[data-previous-style]').addEventListener('click', () => selectStyle(state.style - 1));
      document.querySelector('[data-next-style]').addEventListener('click', () => selectStyle(state.style + 1));
      document.querySelector('[data-previous-scene]').addEventListener('click', () => selectScene(state.scene - 1));
      document.querySelector('[data-next-scene]').addEventListener('click', () => selectScene(state.scene + 1));
      await selectStyle(0);
    </script>
  </body>
</html>
